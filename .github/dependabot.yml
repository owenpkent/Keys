# Dependabot configuration. Addresses scorecard/Dependency-Update-Tool.
#
# Weekly cadence for GitHub Actions. This is the only ecosystem Dependabot
# supports for this repo: the C++ deps (JUCE, okstudio-juce-kit) are pinned by
# git ref in CMake, which Dependabot does not track. A configured ecosystem
# with no manifest makes Dependabot log a failed run every cycle, so only the
# github-actions block is enabled.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Batch all action bumps into a single PR so each cycle triggers one
    # CI + scan run, not one per updated action.
    groups:
      actions:
        patterns:
          - "*"
