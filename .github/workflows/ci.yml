name: CI

# Docs/screenshot-only pushes don't need a build; every skipped run saves
# 2x-billed Windows minutes.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'assets/**'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'assets/**'
      - 'docs/**'

# Least privilege: this workflow only reads source and uploads an artifact.
permissions:
  contents: read

# Cancel an in-flight build when a newer commit lands on the same branch/PR,
# so rapid pushes don't stack 2x-billed Windows runs to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Windows only. Owen ships Windows; the macos-latest leg was dropped
    # 2026-07-22 because macOS runners bill included Actions minutes at 10x
    # (the "90% of included minutes" warning). If mac builds ever return,
    # revive the matrix from git history or a self-hosted Mac runner (see
    # homelab-network/CHECKLIST.md).
    name: windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Checkout JUCE
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: juce-framework/JUCE
          ref: 8.0.8
          path: juce-sdk
          persist-credentials: false

      # The kit is a private repo. Access is a read-only deploy key on the kit
      # ("Keys CI (read-only)"), stored here as the KIT_DEPLOY_KEY secret. No PAT
      # and no user identity involved; revoke by deleting the deploy key.
      - name: Checkout okstudio-juce-kit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: owenpkent/okstudio-juce-kit
          ssh-key: ${{ secrets.KIT_DEPLOY_KEY }}
          path: okstudio-juce-kit
          persist-credentials: false

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DKEYS_JUCE_PATH="${{ github.workspace }}/juce-sdk"
          -DOKSTUDIO_KIT_PATH="${{ github.workspace }}/okstudio-juce-kit"
          -DKEYS_COPY_PLUGIN=OFF

      - name: Build VST3
        run: cmake --build build --config Release --target Keys_VST3

      - name: Build tests
        run: cmake --build build --config Release --target Keys_tests

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Keys-VST3-win64
          path: build/Keys_artefacts/Release/VST3/Keys.vst3
